<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <defs>
    <filter id="neonGlowCalc2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="calcMetal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132227" />
      <stop offset="100%" stop-color="#070B0D" />
    </linearGradient>
  </defs>

  <!-- Dark Tech Background -->
  <rect x="0" y="0" width="100" height="100" rx="16" fill="#101418" />

  <!-- Outer Cyber Border -->
  <rect x="5.5" y="5.5" width="89" height="89" rx="13" fill="url(#calcMetal2)"
        stroke="#4DD0E1" stroke-width="2.2" filter="url(#neonGlowCalc2)" />

  <!-- Cross dividing the four quadrants -->
  <g stroke="#4DD0E1" stroke-width="2" filter="url(#neonGlowCalc2)">
    <line x1="50" y1="12" x2="50" y2="88" />
    <line x1="12" y1="50" x2="88" y2="50" />
  </g>

  <!-- Symbols -->
  <g stroke="#4DD0E1" stroke-width="3.4" stroke-linecap="round" fill="none" filter="url(#neonGlowCalc2)">
    <!-- Plus: top-left -->
    <line x1="30" y1="22" x2="30" y2="38" />
    <line x1="22" y1="30" x2="38" y2="30" />

    <!-- Minus: top-right -->
    <line x1="62" y1="30" x2="78" y2="30" />

    <!-- Multiply (x): bottom-left -->
    <line x1="22" y1="62" x2="38" y2="78" />
    <line x1="38" y1="62" x2="22" y2="78" />

    <!-- Equals: bottom-right -->
    <line x1="62" y1="65" x2="78" y2="65" />
    <line x1="62" y1="75" x2="78" y2="75" />
  </g>
</svg>
