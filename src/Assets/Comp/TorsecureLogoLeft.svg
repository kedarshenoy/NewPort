<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#B59BF2" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Monitor Body -->
  <g filter="url(#purpleGlow)">
    <!-- Stand neck -->
    <rect x="44" y="67" width="12" height="11" fill="#B59BF2" />
    <!-- Stand base -->
    <rect x="34" y="78" width="32" height="6" rx="3" fill="#B59BF2" />
    <!-- Monitor Bezel -->
    <rect x="15" y="15" width="70" height="52" rx="8" fill="#B59BF2" />
    <!-- Screen background -->
    <rect x="19" y="19" width="62" height="44" rx="4" fill="#131217" />
  </g>
  
  <!-- QR Code Container -->
  <rect x="31" y="22" width="38" height="38" rx="2" fill="#FFFFFF" />
  
  <!-- QR Code Finder Patterns (Corners) -->
  <!-- Top-left -->
  <rect x="33" y="24" width="10" height="10" fill="#131217" />
  <rect x="35" y="26" width="6" height="6" fill="#FFFFFF" />
  <rect x="37" y="28" width="2" height="2" fill="#131217" />
  
  <!-- Top-right -->
  <rect x="57" y="24" width="10" height="10" fill="#131217" />
  <rect x="59" y="26" width="6" height="6" fill="#FFFFFF" />
  <rect x="61" y="28" width="2" height="2" fill="#131217" />
  
  <!-- Bottom-left -->
  <rect x="33" y="48" width="10" height="10" fill="#131217" />
  <rect x="35" y="50" width="6" height="6" fill="#FFFFFF" />
  <rect x="37" y="52" width="2" height="2" fill="#131217" />
  
  <!-- Bottom-right Alignment Pattern -->
  <rect x="59" y="50" width="6" height="6" fill="#131217" />
  <rect x="61" y="52" width="2" height="2" fill="#FFFFFF" />
  <rect x="61.5" y="52.5" width="1" height="1" fill="#131217" />
  
  <!-- QR Code Random Data Blocks for high-fidelity look -->
  <g fill="#131217">
    <rect x="45" y="24" width="2" height="4" />
    <rect x="49" y="24" width="4" height="2" />
    <rect x="45" y="30" width="4" height="2" />
    <rect x="51" y="28" width="2" height="4" />
    <rect x="45" y="34" width="2" height="2" />
    <rect x="49" y="34" width="4" height="2" />
    <rect x="33" y="36" width="6" height="2" />
    <rect x="33" y="40" width="2" height="4" />
    <rect x="37" y="44" width="4" height="2" />
    <rect x="43" y="38" width="2" height="4" />
    <rect x="47" y="40" width="6" height="2" />
    <rect x="55" y="36" width="2" height="6" />
    <rect x="59" y="36" width="4" height="2" />
    <rect x="63" y="40" width="2" height="4" />
    <rect x="59" y="46" width="4" height="2" />
    <rect x="45" y="44" width="2" height="6" />
    <rect x="49" y="48" width="4" height="2" />
    <rect x="45" y="52" width="6" height="2" />
    <rect x="53" y="52" width="2" height="4" />
    <rect x="57" y="56" width="6" height="2" />
    <rect x="49" y="56" width="2" height="2" />
  </g>
</svg>
